  - Comision

# IMPORTANTE: las categorías más específicas van ANTES de las genéricas, así
# "TRF SPI SUELDOS" matchea Sueldo y no la regla genérica de Transferencias.

# El banco lo cobra como débito (gasto): es la devolución del adelanto pedido.
Adelanto de sueldo:
  - COBRO DE ADS

Sueldo:
  - SUELDOS

Ingresos varios:
  - TRANSFERENCIA RECIBIDA
  - DEVOL MASTER
  - TRASPASO DE DINERO

Transferencias:
  - TRANSFERENCIA SPI ENVIADA
  - E-BROU
  - TRF SPI

Retiros:
  - Retiro Red
