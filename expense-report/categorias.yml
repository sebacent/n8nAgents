# Reglas de clasificación para el importador de estados de cuenta.
#
# Cada clave es el nombre de la categoría y su valor es una lista de patrones
# (substrings, case-insensitive) que matchean contra la descripción del
# movimiento. El primer match gana (las categorías se evalúan en orden).
# Lo que no matchea ningún patrón queda como 'Sin clasificar'.
#
# El 'tipo' (gasto/ingreso) NO se define acá: lo determina SIEMPRE la fuente
# del dato (las columnas Débito/Crédito del banco, o la columna 'tipo' del CSV
# manual), por encima de cualquier regla. Estas reglas solo asignan categoría.

Comida:
  - PedidosYa
  - Tienda Inglesa
  - Disco N
  - Devoto
  - Autoservice
  - MC Donald
  - KFC
  - Hurban Food
  - Quarta Market
  - Ghanima
  - Sol y Luna
