<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin — Burger Palace{% endblock %}</title>
  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Admin CSS -->
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-brand">
    <h5><i class="bi bi-fire"></i> Burger Palace</h5>
    <small>Panel de Administración</small>
  </div>
  <ul class="nav flex-column mt-2">
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/admin/dashboard">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'orders' %}active{% endif %}" href="/admin/orders">
        <i class="bi bi-receipt"></i> Pedidos
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'menu' %}active{% endif %}" href="/admin/menu">
        <i class="bi bi-menu-button-wide"></i> Menú
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'customers' %}active{% endif %}" href="/admin/customers">
        <i class="bi bi-people"></i> Clientes
      </a>
    </li>
  </ul>
  <div class="mt-auto p-3">
    <small class="text-muted" style="color: rgba(255,255,255,.3) !important;">
      <i class="bi bi-whatsapp"></i> WhatsApp Bot v1.0
    </small>
  </div>
</nav>

<!-- Main content -->
<div class="main-content">
  <!-- Topbar -->
  <div class="topbar d-flex align-items-center justify-content-between">
    <div>
      <h6 class="mb-0 fw-semibold">{% block page_title %}Panel{% endblock %}</h6>
    </div>
    <div class="d-flex align-items-center gap-3">
      <small class="text-muted" id="current-datetime"></small>
      <span class="badge bg-success"><i class="bi bi-circle-fill" style="font-size:.5rem"></i> Online</span>
    </div>
  </div>

  <!-- Content area -->
  <div class="content-area">
    {% block content %}{% endblock %}
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Update datetime in topbar
  function updateDatetime() {
    const now = new Date();
    const options = {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    };
    const el = document.getElementById('current-datetime');
    if (el) el.textContent = now.toLocaleDateString('es-AR', options);
  }
  updateDatetime();
  setInterval(updateDatetime, 1000);
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
